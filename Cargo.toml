[package]
name = "indexflow-core"
version = "0.1.0"
edition = "2021"
description = "Open Core Search Index Infrastructure"
authors = ["IndexFlow Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/IndexFlowing/IndexFlow-core"
homepage = "https://www.indexflowing.com"
readme = "README.md"
keywords = ["seo", "sitemap", "search", "indexing", "web"]
categories = ["web-programming", "command-line-utilities"]
include = [
    "src/**/*",
    "templates/**/*",
    "migrations/**/*",
    "Cargo.toml",
    "README.md",
]

[workspace]
members = ["crates/indexflow-sitemap", "crates/indexflow-seo"]
resolver = "2"

[dependencies]
# 内部独立库
indexflow-sitemap = { version = "0.1.1", path = "crates/indexflow-sitemap" }
indexflow-seo = { version = "0.1.3", path = "crates/indexflow-seo" }

# Web
axum = { version = "0.7", features = ["macros"] }
askama = "0.12"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database (SQLite)
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "migrate",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
serde_json = "1"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Utilities
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"
bcrypt = "0.15"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
