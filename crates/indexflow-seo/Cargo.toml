[package]
name = "indexflow-seo"
version = "0.1.3"
edition = "2021"
description = "High-performance Technical SEO quality gate & GEO (Generative Engine Optimization) auditor for modern search engines and AI crawlers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IndexFlowing/IndexFlow-core"
homepage = "https://www.indexflowing.com"
documentation = "https://docs.rs/indexflow-seo"
readme = "README.md"
keywords = ["seo", "geo", "json-ld", "canonical", "audit"]
categories = ["web-programming", "parser-implementations"]
include = [
    "src/**/*",
    "examples/**/*",
    "Cargo.toml",
    "README.md",
    "README_ZH.md",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "1"
tracing = "0.1"
reqwest = { version = "0.11", features = ["rustls-tls"], default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
default = ["probe"]
probe = ["dep:reqwest"]