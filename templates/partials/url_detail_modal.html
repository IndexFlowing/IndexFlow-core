<!-- File: templates/partials/url_detail_modal.html -->
<!-- 诊断抽屉容器 -->
<div id="url-drawer-root" class="fixed inset-0 z-50 overflow-hidden font-sans">
    <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity duration-300 ease-out" 
         onclick="document.getElementById('url-drawer-root').remove()"></div>

    <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
        <div class="w-screen max-w-3xl bg-slate-900 border-l border-slate-800 shadow-2xl flex flex-col transform transition ease-in-out duration-300">
            
            <!-- 顶部 Header -->
            <div class="px-6 py-5 border-b border-slate-800 bg-slate-950/80 backdrop-blur flex items-start justify-between shrink-0">
                <div class="space-y-1.5 min-w-0 pr-4">
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="text-xs font-mono font-bold px-2 py-0.5 rounded-md bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">URL #{{ url.id }}</span>
                        <span class="text-xs text-slate-400 font-mono">{{ url.locale }} · 路径 {{ url.path_prefix }}</span>
                        {% if url.is_seo_pass() %}
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">✓ 门禁通过</span>
                        {% else if url.is_seo_warn() %}
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">⚠️ 存在优化项 ({{ url.warning_count() }})</span>
                        {% else %}
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20">🛑 门禁拦截</span>
                        {% endif %}
                    </div>

                    <h3 class="text-sm font-bold text-white tracking-tight break-all font-mono">
                        <a href="{{ url.url }}" target="_blank" rel="noopener noreferrer" class="hover:text-cyan-400 transition flex items-center gap-1.5 group/link">
                            <span>{{ url.url }}</span>
                            <span class="text-xs text-slate-500 group-hover/link:text-cyan-400">↗ 打开原站</span>
                        </a>
                    </h3>
                </div>

                <button onclick="document.getElementById('url-drawer-root').remove()" 
                        class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition text-lg shrink-0">✕</button>
            </div>

            <!-- 主内容区：复用 5 大核心诊断卡片组件 -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6 text-slate-200 text-xs">
                {% include "partials/seo_audit_cards.html" %}
            </div>

            <!-- 底部操作栏：遵循模块单一职责（SRP）原则，去除无关操作 -->
            <div class="px-6 py-4 border-t border-slate-800 bg-slate-950/90 backdrop-blur flex items-center justify-between gap-3 text-xs shrink-0">
                <div class="flex items-center gap-2">
                    <a href="{{ url.url }}" target="_blank" rel="noopener noreferrer" 
                       class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition font-medium flex items-center gap-1.5 border border-slate-700">
                        <span>↗</span> 访问原网页
                    </a>
                    <a href="/seo/detail/{{ url.id }}" target="_blank" rel="noopener noreferrer" 
                       class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition font-medium flex items-center gap-1.5 border border-slate-700">
                        <span>⛶</span> 全屏独立报告
                    </a>
                </div>

                <!-- 模块 2 唯一核心动作：重新质检该网页（带即时视觉反馈） -->
                <button hx-post="/api/v1/urls/{{ url.id }}/inspect?engine=seo"
                        hx-target="#url-drawer-root"
                        hx-swap="outerHTML"
                        hx-disabled-elt="this"
                        hx-on::before-request="this.innerHTML = '<span>⏳</span> <span>正在执行门禁质检...</span>'"
                        hx-on::after-request="showToast('✅ 页面 SEO 重新质检完成！')"
                        class="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-semibold transition active:scale-95 flex items-center gap-2 shadow-lg shadow-amber-950/40 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                    <span>🛡️</span> <span>重新质检该网页</span>
                </button>
            </div>

        </div>
    </div>
</div>
