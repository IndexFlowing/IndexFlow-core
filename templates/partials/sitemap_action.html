<div id="sitemap-action-box" 
     {% if is_sync_running %}
     hx-get="/partials/actions/sitemap?site_id={{ current_site_id }}" 
     hx-trigger="every 2s" 
     hx-swap="outerHTML"
     {% endif %}>
    {% if is_sync_running %}
    <button hx-post="/api/v1/actions/cancel-sync?site_id={{ current_site_id }}" 
            hx-target="#sitemap-action-box"
            hx-swap="outerHTML"
            hx-on::after-request="showToast('已停止 Sitemap 同步', true)"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white shadow-lg shadow-rose-900/30 transition active:scale-95 flex items-center gap-2 animate-pulse">
        <span>⏹️</span> 停止同步 (流式解析中...)
    </button>
    {% else %}
    <button hx-post="/api/v1/actions/sync-sitemap?site_id={{ current_site_id }}" 
            hx-target="#sitemap-action-box"
            hx-swap="outerHTML"
            hx-on::after-request="showToast('Sitemap 流式同步已启动...')"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white shadow-lg shadow-cyan-500/20 transition active:scale-95 flex items-center gap-2">
        <span>🔄</span> 开始同步 Sitemap
    </button>
    {% endif %}
</div>
