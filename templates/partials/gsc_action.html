<div id="gsc-action-box" 
     {% if is_gsc_running %}
     hx-get="/partials/actions/gsc?site_id={{ current_site_id }}" 
     hx-trigger="every 2s" 
     hx-swap="outerHTML"
     {% endif %}>
    {% if is_gsc_running %}
    <button hx-post="/api/v1/actions/cancel-gsc?site_id={{ current_site_id }}" 
            hx-target="#gsc-action-box"
            hx-swap="outerHTML"
            hx-on::after-request="showToast('已停止 GSC 检测', true)"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white shadow-lg shadow-rose-900/30 transition active:scale-95 flex items-center gap-2 animate-pulse">
        <span>⏹️</span> 停止 GSC (10并发检测中...)
    </button>
    {% else %}
    <button hx-post="/api/v1/actions/inspect-gsc?site_id={{ current_site_id }}" 
            hx-target="#gsc-action-box"
            hx-swap="outerHTML"
            hx-on::after-request="showToast('GSC 增量收录检测已启动...')"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white shadow-lg shadow-cyan-500/20 transition active:scale-95 flex items-center gap-2">
        <span>🔍</span> 启动 GSC 增量检测
    </button>
    {% endif %}
</div>
