<div id="gsc-action-box" 
     class="flex flex-wrap items-center gap-2.5"
     {% if is_gsc_running %}
     hx-get="/partials/actions/gsc?site_id={{ current_site_id }}" 
     hx-trigger="every 2s" 
     hx-swap="outerHTML"
     {% endif %}>

    <!-- 1. 一键批量同步曝光收录池 (0配额) -->
    <button hx-post="/api/v1/actions/sync-gsc-analytics?site_id={{ current_site_id }}" 
            hx-target="#gsc-action-box"
            hx-swap="outerHTML"
            hx-on::before-request="this.disabled = true; this.classList.add('opacity-50')"
            hx-on::after-request="showToast('🎉 成功从 Google 搜索结果中批量同步已收录页面！'); setTimeout(() => location.reload(), 800)"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-900/30 transition active:scale-95 flex items-center gap-2 border border-emerald-500/30 cursor-pointer">
        <span>⚡</span> 同步曝光收录池 (0配额)
    </button>

    <!-- 2. 单条增量深度质检开关 (根据配额与运行状态呈现 3 种形态) -->
    {% if is_gsc_running %}
    <button hx-post="/api/v1/actions/cancel-gsc?site_id={{ current_site_id }}" 
            hx-target="#gsc-action-box"
            hx-swap="outerHTML"
            hx-on::after-request="showToast('已停止 GSC 检测', true)"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white shadow-lg shadow-rose-900/30 transition active:scale-95 flex items-center gap-2 animate-pulse cursor-pointer">
        <span>⏹️</span> 停止 GSC (3并发检测中...)
    </button>
    {% else if is_quota_exhausted %}
    <button disabled 
            title="今日 GSC 2,000 次配额已全部用尽，请等待 24 小时滚动窗口释放额度"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800/80 text-slate-500 border border-slate-700/50 cursor-not-allowed flex items-center gap-2 shadow-inner">
        <span>🛑</span> 今日配额已耗尽 (剩余 0)
    </button>
    {% else %}
    <button hx-post="/api/v1/actions/inspect-gsc?site_id={{ current_site_id }}" 
            hx-target="#gsc-action-box"
            hx-swap="outerHTML"
            hx-on::after-request="showToast('GSC 增量收录检测已启动...')"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white shadow-lg shadow-cyan-500/20 transition active:scale-95 flex items-center gap-2 cursor-pointer">
        <span>🔍</span> 启动 GSC 增量检测
    </button>
    {% endif %}
</div>
