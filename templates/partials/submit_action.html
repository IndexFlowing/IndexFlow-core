<div id="submit-action-box" 
     {% if is_submit_running %}
     hx-get="/partials/actions/submit?site_id={{ current_site_id }}" 
     hx-trigger="every 2s" 
     hx-swap="outerHTML"
     {% endif %}>
    {% if is_submit_running %}
    <button hx-post="/api/v1/actions/cancel-submit?site_id={{ current_site_id }}" 
            hx-target="#submit-action-box"
            hx-swap="outerHTML"
            hx-on::after-request="showToast('已停止全引擎提交', true)"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white shadow-lg shadow-rose-900/30 transition active:scale-95 flex items-center gap-2 animate-pulse">
        <span>⏹️</span> 停止提交 (推送队列运行中...)
    </button>
    {% else %}
    <button hx-post="/api/v1/actions/submit-all?site_id={{ current_site_id }}" 
            hx-target="#submit-action-box"
            hx-swap="outerHTML"
            hx-on::after-request="showToast('全引擎增量提交已启动...')"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white shadow-lg shadow-cyan-500/20 transition active:scale-95 flex items-center gap-2">
        <span>🚀</span> 启动全引擎增量提交
    </button>
    {% endif %}
</div>
