<!DOCTYPE html>
<html lang="{{ lang }}" class="h-full bg-slate-950 text-slate-100 selection:bg-indigo-500 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IndexFlow{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="min-h-full flex flex-col font-sans">
    <!-- 全局 Toast 提示气泡容器 -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl border text-sm font-medium shadow-2xl flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto ${
                isError 
                ? 'bg-rose-950/90 border-rose-800 text-rose-200' 
                : 'bg-slate-900/95 border-slate-700 text-emerald-300'
            }`;
            toast.innerHTML = `<span>${isError ? '⚠️' : '⚡'}</span><span>${message}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>

    <!-- 顶部导航栏 -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <a href="/" class="flex items-center space-x-3">
                    <span class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center font-black text-xl text-white tracking-wider">IF</span>
                    <span class="text-xl font-bold tracking-tight text-white">IndexFlow</span>
                    <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-mono">OpenCore</span>
                </a>
                <nav class="hidden md:flex space-x-1">
                    <a href="/" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-800 text-slate-300 hover:text-white transition">{{ t.nav_dashboard }}</a>
                    <a href="/urls" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-800 text-slate-300 hover:text-white transition">{{ t.nav_urls }}</a>
                    <a href="/settings" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-800 text-slate-300 hover:text-white transition">{{ t.nav_settings }}</a>
                </nav>
            </div>
            <div class="flex items-center space-x-4">
                <span class="hidden sm:flex text-xs text-amber-400 font-mono items-center gap-1.5 bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-full">
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                    {{ t.dry_run_badge }}
                </span>

                <!-- 语言切换器 -->
                <div class="flex items-center rounded-lg bg-slate-800 p-0.5 text-xs font-medium border border-slate-700">
                    <a href="?lang=zh" class="px-2 py-1 rounded {% if lang == "zh" %}bg-indigo-600 text-white font-bold{% else %}text-slate-400 hover:text-slate-200{% endif %}">中文</a>
                    <a href="?lang=en" class="px-2 py-1 rounded {% if lang == "en" %}bg-indigo-600 text-white font-bold{% else %}text-slate-400 hover:text-slate-200{% endif %}">EN</a>
                </div>
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- 底部状态栏 -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500 flex items-center justify-center gap-2">
        <span>{{ t.footer_text }}</span>
        <span>·</span>
        <a href="https://www.indexflowing.com" target="_blank" rel="noopener noreferrer" class="text-indigo-400 hover:text-indigo-300 font-medium underline underline-offset-2 transition">
            Powered by IndexFlowing
        </a>
    </footer>
</body>
</html>
