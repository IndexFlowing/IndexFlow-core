{% extends "base.html" %}

{% block title %}{{ t.nav_settings }} - IndexFlow{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div>
        <h2 class="text-2xl font-bold text-white tracking-tight">{{ t.settings_title }}</h2>
        <p class="text-sm text-slate-400 mt-1">{{ t.settings_desc }}</p>
    </div>

    <form method="POST" action="/settings" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6 shadow-xl">
        <div>
            <label class="block text-sm font-medium text-slate-200">{{ t.label_domain }}</label>
            <input type="text" name="domain" value="{{ domain }}" placeholder="example.com" required class="mt-2 block w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5 text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:text-sm">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-200">{{ t.label_sitemap }}</label>
            <input type="url" name="sitemap_url" value="{{ sitemap_url }}" placeholder="https://example.com/sitemap.xml" class="mt-2 block w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5 text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:text-sm">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-200">{{ t.label_bing_key }}</label>
            <input type="text" name="bing_indexnow_key" value="{{ bing_indexnow_key }}" placeholder="32位 IndexNow 密钥" class="mt-2 block w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5 text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:text-sm">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-200">{{ t.label_google_sa }}</label>
            <textarea name="google_service_account_json" rows="6" placeholder='{"type": "service_account", ...}' class="mt-2 block w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5 font-mono text-xs text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">{{ google_service_account_json }}</textarea>
        </div>

        <div class="pt-4 border-t border-slate-800 flex justify-end">
            <button type="submit" class="px-6 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition active:scale-95 shadow-md">{{ t.btn_save_settings }}</button>
        </div>
    </form>
</div>
{% endblock %}
