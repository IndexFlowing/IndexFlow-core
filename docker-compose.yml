services:
  indexflow:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: sqlite:/app/data/indexflow.db?mode=rwc
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DRY_RUN: ${DRY_RUN:-true}
      RUST_LOG: ${RUST_LOG:-indexflow_core=info,tower_http=info}
    volumes:
      - indexflow-data:/app/data
    restart: unless-stopped

volumes:
  indexflow-data:
